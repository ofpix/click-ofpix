# Click You, Click Me - OFPiX 摄影博客存档
title: Click You, Click Me
tagline: 摄影如奇遇 — OFPiX 存档
description: >-
  2007-2009 年 OFPiX 旗下的摄影博客 Click You, Click Me（后更名为 Click US）
  的完整存档，包含 104 篇关于摄影、肖像、工作坊的原创文章。
url: "https://ofpix.github.io"
baseurl: "/click-ofpix"
github: "ofpix/click-ofpix"

lang: zh-CN
timezone: Asia/Shanghai

theme: jekyll-theme-chirpy

# No avatar needed - will use default

social:
  name: OFPiX
  links:
    - https://ofpix.com

# Pagination
paginate: 20
paginate_path: /page:num/

# Chirpy theme settings  
tabs:
  - { title: 文章列表, icon: "fas fa-archive", url: /archives, order: 1 }
  - { title: 分类, icon: "fas fa-stream", url: /categories, order: 2 }
  - { title: 标签, icon: "fas fa-tags", url: /tags, order: 3 }
  - { title: 关于, icon: "fas fa-info-circle", url: /about, order: 4 }

# Timezone
timezone: Asia/Shanghai

# Markdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /:year/:month/:day/:title/

# Sitemap & RSS
sitemap: true
feed:
  path: /feed.xml
